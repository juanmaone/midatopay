name: Deploy Frontend to Cloud Run

on:
  push:
    branches:
      - develop
      - main
      - production
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

env:
  # Configuración General
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1 # Ajusta a tu región preferida
  REPO_NAME: midatopay-repo # Nombre de tu Artifact Registry

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Determinar ambiente y variables según la rama
      - name: Set Environment Variables
        id: env-vars
        run: |
          if [[ "${{ github.ref_name }}" == "production" ]]; then
            echo "ENV_NAME=prod" >> $GITHUB_ENV
            echo "API_URL=${{ secrets.API_URL_PROD }}" >> $GITHUB_ENV
            echo "WS_URL=${{ secrets.WS_URL_PROD }}" >> $GITHUB_ENV
            echo "SERVICE_NAME=midatopay-front-prod" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "ENV_NAME=test" >> $GITHUB_ENV
            echo "API_URL=${{ secrets.API_URL_TEST }}" >> $GITHUB_ENV
            echo "WS_URL=${{ secrets.WS_URL_TEST }}" >> $GITHUB_ENV
            echo "SERVICE_NAME=midatopay-front-test" >> $GITHUB_ENV
          else
            echo "ENV_NAME=dev" >> $GITHUB_ENV
            echo "API_URL=${{ secrets.API_URL_DEV }}" >> $GITHUB_ENV
            echo "WS_URL=${{ secrets.WS_URL_DEV }}" >> $GITHUB_ENV
            echo "SERVICE_NAME=midatopay-front-dev" >> $GITHUB_ENV
          fi

      # 2. Autenticación con Google Cloud
      # Se recomienda usar Workload Identity Federation en lugar de JSON keys por seguridad
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }} # O usa workload_identity_provider

      # 3. Configurar Docker para usar gcloud como helper
      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # 4. Build y Push de la imagen Docker
      # Pasamos las build-args aquí para que Next.js las incorpore
      - name: Build and Push Container
        run: |
          IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ env.API_URL }} \
            --build-arg NEXT_PUBLIC_WS_URL=${{ env.WS_URL }} \
            -t $IMAGE_TAG \
            ./frontend
          
          docker push $IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # 5. Desplegar en Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE_TAG }}
          region: ${{ env.REGION }}
          flags: '--allow-unauthenticated --port=3000'
          # Nota: Cloud Run inyecta la variable PORT, pero tu Dockerfile expone 3000.
          # Next.js suele escuchar en PORT si está definido, o 3000 por defecto.
          # Usamos --port=3000 para decirle a Cloud Run a dónde enviar el tráfico.
